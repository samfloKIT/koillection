version: '3'
services:
    koillection:
        image: koillection/koillection:frankenphp
        container_name: koillection
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        env_file:
            - stack.env
        depends_on:
            - db
        volumes:
            - uploads:/uploads
    db:
        image: postgres:16
        container_name: db
        restart: unless-stopped
        env_file:
            - stack.env
        environment:
            - POSTGRES_DB=${DB_NAME}
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        volumes:
            - pgsql:/var/lib/postgresql/data
volumes:
  uploads:
  pgsql:
